<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Keys — Investment-AI_T</title>
  <style>
    :root {
      --bg: #111814;
      --panel: rgba(245, 236, 216, 0.92);
      --paper: #fff7e8;
      --ink: #1a221e;
      --muted: #67716a;
      --line: rgba(65, 79, 69, 0.18);
      --gold: #c4913d;
      --green: #2c8b67;
      --red: #ad4f43;
      --blue: #2f668f;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(196, 145, 61, 0.34), transparent 32rem),
        radial-gradient(circle at 88% 16%, rgba(44, 139, 103, 0.26), transparent 30rem),
        linear-gradient(140deg, #101713, #253229 48%, #5a442a);
      font-family: "Trebuchet MS", "Gill Sans", Verdana, sans-serif;
    }

    .wrap {
      width: min(1100px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    /* ── NAV ───────────────────────────────────────────────────────────── */
    .nav {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }
    .nav a {
      color: rgba(255, 247, 232, 0.7);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 12px;
      transition: all 0.2s;
    }
    .nav a:hover { background: rgba(255, 255, 255, 0.08); color: #fff7e8; }
    .nav a.active { background: rgba(196, 145, 61, 0.22); color: var(--gold); }

    /* ── HERO ──────────────────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, rgba(255, 247, 232, 0.96), rgba(239, 222, 191, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: clamp(22px, 4vw, 36px);
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: "";
      position: absolute;
      right: -90px; bottom: -120px;
      width: 280px; height: 280px;
      border-radius: 50%;
      background: rgba(196, 145, 61, 0.18);
    }
    .eyebrow { color: var(--gold); font-size: 0.78rem; font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin: 10px 0 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.8rem, 5vw, 3.4rem); line-height: 0.95; letter-spacing: -0.04em; }
    .hero p { max-width: 700px; margin: 12px 0 0; color: var(--muted); font-size: 0.95rem; }

    /* ── SUPABASE INPUTS ───────────────────────────────────────────────── */
    .config-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      margin-top: 18px;
      position: relative;
      z-index: 1;
    }
    input, select, button { border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; font: inherit; font-size: 0.92rem; }
    input, select { background: rgba(255, 255, 255, 0.78); min-width: 0; }
    button { background: var(--ink); color: #fff7e8; cursor: pointer; font-weight: 800; transition: opacity 0.15s; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: default; }

    /* ── SECTION ──────────────────────────────────────────────────────────── */
    section {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 24px;
      box-shadow: var(--shadow);
      margin-top: 18px;
      padding: 22px;
    }

    /* ── DYNAMIC PROVIDERS ─────────────────────────────────────────────── */
    .provider-card {
      background: rgba(255, 247, 232, 0.6);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      position: relative;
    }
    .provider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--line);
    }
    .provider-title {
      font-family: Georgia, serif;
      font-size: 1.15rem;
      font-weight: bold;
    }
    .provider-title span.badge {
      font-family: sans-serif;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      margin-left: 10px;
      background: rgba(44, 139, 103, 0.15);
      color: var(--green);
    }
    .provider-title span.badge.fallback {
      background: rgba(196, 145, 61, 0.15);
      color: var(--gold);
    }
    .provider-controls button {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.6);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .provider-controls button:hover {
      background: var(--ink);
      color: #fff;
    }
    .provider-controls button.btn-danger {
      color: var(--red);
      border-color: rgba(173, 79, 67, 0.3);
    }
    .provider-controls button.btn-danger:hover {
      background: var(--red);
      color: #fff;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .form-row.full { grid-template-columns: 1fr; }
    label { display: block; color: var(--muted); font-size: 0.76rem; font-weight: 900; letter-spacing: 0.09em; text-transform: uppercase; margin-bottom: 5px; }

    .field-group input, .field-group select { width: 100%; }

    .add-provider-btn {
      width: 100%;
      background: rgba(44, 139, 103, 0.12);
      color: var(--green);
      border: 1px dashed rgba(44, 139, 103, 0.4);
      padding: 16px;
      font-size: 1rem;
    }
    .add-provider-btn:hover {
      background: rgba(44, 139, 103, 0.22);
    }

    .save-row { display: flex; gap: 10px; align-items: center; margin-top: 24px; }
    .save-row button { padding: 13px 28px; font-size: 1rem; }

    .test-api-btn {
      background: rgba(47, 102, 143, 0.12);
      color: var(--blue);
      border: 1px solid rgba(47, 102, 143, 0.3);
      width: 100%;
    }
    .test-api-btn:hover {
      background: rgba(47, 102, 143, 0.22);
      color: var(--blue);
    }

    /* ── STATUS BAR ────────────────────────────────────────────────────── */
    .status-bar {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 700;
      display: none;
    }
    .status-bar.success { display: block; background: rgba(44, 139, 103, 0.12); color: var(--green); border: 1px solid rgba(44, 139, 103, 0.25); }
    .status-bar.error { display: block; background: rgba(173, 79, 67, 0.12); color: var(--red); border: 1px solid rgba(173, 79, 67, 0.25); }
    .status-bar.info { display: block; background: rgba(47, 102, 143, 0.12); color: var(--blue); border: 1px solid rgba(47, 102, 143, 0.25); }

    @media (max-width: 800px) {
      .form-row, .config-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- NAV -->
    <nav class="nav">
      <a href="index.html">📊 Dashboard</a>
      <a href="settings.html">⚙ Account Settings</a>
      <a href="api_keys.html" class="active">🔑 API Keys</a>
    </nav>

    <!-- HERO -->
    <header class="hero">
      <div class="eyebrow">Investment-AI_T system config</div>
      <h1>System & API Keys</h1>
      <p>Configure global AI providers and API keys. The bot dynamically fails over from top to bottom.</p>
      
      <div class="config-row">
        <input id="supabaseUrl" placeholder="Supabase URL, e.g. https://xxxx.supabase.co">
        <input id="supabaseAnon" placeholder="Supabase anon key">
        <button id="loadBtn">Load Config</button>
      </div>
    </header>

    <!-- FORM -->
    <section id="settingsPanel">
      <div id="providersContainer"></div>
      <button class="add-provider-btn" onclick="addProvider()">+ Add AI Provider</button>

      <div class="save-row">
        <button onclick="saveSettings()">💾 Save Config</button>
        <span id="lastSavedTxt" style="color:var(--muted);font-size:0.8rem;margin-left:auto"></span>
      </div>
      <div class="status-bar" id="statusBar"></div>
    </section>
  </main>

  <script>
    const DEFAULT_SUPABASE_URL = "https://kusyjtpcjyflxgfcqenb.supabase.co";
    const DEFAULT_SUPABASE_ANON = "sb_publishable_Pdf-F-j3PH3keLsZ8ZoEZA_tbotGoxM";
    const $ = (id) => document.getElementById(id);

    const state = {
      url: localStorage.getItem("supabaseUrl") || DEFAULT_SUPABASE_URL,
      anon: localStorage.getItem("supabaseAnon") || DEFAULT_SUPABASE_ANON,
      sys: null,
      providers: []
    };

    $("supabaseUrl").value = state.url;
    $("supabaseAnon").value = state.anon;

    $("loadBtn").addEventListener("click", () => {
      state.url = $("supabaseUrl").value.trim().replace(/\/$/, "");
      state.anon = $("supabaseAnon").value.trim();
      localStorage.setItem("supabaseUrl", state.url);
      localStorage.setItem("supabaseAnon", state.anon);
      loadSystemSettings();
    });

    // ── SUPABASE HELPERS ─────────────────────────────────────────────────
    async function sbGet(path) {
      if (!state.url || !state.anon) return [];
      const res = await fetch(`${state.url}/rest/v1/${path}`, {
        headers: { apikey: state.anon, Authorization: `Bearer ${state.anon}` },
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function sbUpsert(table, data) {
      if (!state.url || !state.anon) throw new Error("No Supabase config");
      const res = await fetch(`${state.url}/rest/v1/${table}`, {
        method: "POST",
        headers: {
          apikey: state.anon,
          Authorization: `Bearer ${state.anon}`,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates",
        },
        body: JSON.stringify(data),
      });
      if (!res.ok) throw new Error(await res.text());
      return true;
    }

    // ── LOAD ─────────────────────────────────────────────────────────────
    async function loadSystemSettings() {
      try {
        const rows = await sbGet("system_settings?id=eq.global");
        if (rows.length > 0) {
          state.sys = rows[0];
          state.providers = state.sys.providers_list || [];
          $("lastSavedTxt").innerText = `Last saved: ${state.sys.updated_at ? new Date(state.sys.updated_at).toLocaleString() : "never"}`;
          
          // Migrate old single provider layout to list if empty
          if (state.providers.length === 0 && state.sys.ai_provider) {
            state.providers.push({
              provider: state.sys.ai_provider,
              api_key: state.sys.ai_provider === 'openrouter' ? state.sys.openrouter_api_key : state.sys.hf_token,
              main_model: state.sys.ai_main_model,
              risk_model: state.sys.ai_risk_model
            });
          }
        } else {
          state.sys = { id: 'global' };
          state.providers = [{
            provider: 'openrouter',
            api_key: '',
            main_model: 'openai/gpt-oss-20b:free',
            risk_model: 'openai/gpt-oss-120b:free'
          }];
        }
        renderProviders();
        showStatus(`Loaded configurations successfully.`, "success");
      } catch (err) {
        showStatus(`Load failed: ${err.message}`, "error");
      }
    }

    // ── RENDER ───────────────────────────────────────────────────────────
    function renderProviders() {
      const container = $("providersContainer");
      container.innerHTML = "";
      
      state.providers.forEach((p, index) => {
        const isPrimary = index === 0;
        const badgeClass = isPrimary ? "badge" : "badge fallback";
        const badgeText = isPrimary ? "Primary" : `Fallback #${index}`;

        const html = `
          <div class="provider-card">
            <div class="provider-header">
              <div class="provider-title">
                Provider #${index + 1} <span class="${badgeClass}">${badgeText}</span>
              </div>
              <div class="provider-controls">
                <button onclick="moveUp(${index})" ${index === 0 ? 'disabled' : ''}>▲ Up</button>
                <button onclick="moveDown(${index})" ${index === state.providers.length - 1 ? 'disabled' : ''}>▼ Down</button>
                <button class="btn-danger" onclick="removeProvider(${index})">✖ Remove</button>
              </div>
            </div>

            <div class="form-row">
              <div class="field-group">
                <label>Provider Platform</label>
                <select onchange="updateProvider(${index}, 'provider', this.value)">
                  <option value="openrouter" ${p.provider === 'openrouter' ? 'selected' : ''}>OpenRouter</option>
                  <option value="openai" ${p.provider === 'openai' ? 'selected' : ''}>OpenAI (ChatGPT)</option>
                  <option value="anthropic" ${p.provider === 'anthropic' ? 'selected' : ''}>Anthropic (Claude)</option>
                  <option value="deepseek" ${p.provider === 'deepseek' ? 'selected' : ''}>DeepSeek</option>
                  <option value="huggingface" ${p.provider === 'huggingface' ? 'selected' : ''}>HuggingFace</option>
                </select>
              </div>
              <div class="field-group">
                <label>API Key</label>
                <input type="password" value="${safe(p.api_key)}" placeholder="sk-..." onchange="updateProvider(${index}, 'api_key', this.value)">
              </div>
            </div>

            <div class="form-row">
              <div class="field-group">
                <label>Main Model</label>
                <input value="${safe(p.main_model)}" placeholder="Model ID..." onchange="updateProvider(${index}, 'main_model', this.value)">
              </div>
              <div class="field-group">
                <label>Risk Review Model</label>
                <input value="${safe(p.risk_model)}" placeholder="Model ID..." onchange="updateProvider(${index}, 'risk_model', this.value)">
              </div>
            </div>

            <div class="form-row full" style="margin-top:10px;">
              <button class="test-api-btn" onclick="testApi(${index})">⚡ Test Connection & API Key</button>
            </div>
            
            <div id="testRes_${index}" style="font-size:0.8rem; margin-top:10px; font-family:monospace;"></div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });
    }

    // ── MUTATIONS ────────────────────────────────────────────────────────
    function updateProvider(index, field, value) {
      state.providers[index][field] = value.trim();
    }

    function addProvider() {
      state.providers.push({
        provider: 'openrouter',
        api_key: '',
        main_model: '',
        risk_model: ''
      });
      renderProviders();
    }

    function removeProvider(index) {
      state.providers.splice(index, 1);
      renderProviders();
    }

    function moveUp(index) {
      if (index === 0) return;
      const temp = state.providers[index - 1];
      state.providers[index - 1] = state.providers[index];
      state.providers[index] = temp;
      renderProviders();
    }

    function moveDown(index) {
      if (index === state.providers.length - 1) return;
      const temp = state.providers[index + 1];
      state.providers[index + 1] = state.providers[index];
      state.providers[index] = temp;
      renderProviders();
    }

    // ── SAVE ─────────────────────────────────────────────────────────────
    async function saveSettings() {
      const payload = {
        id: 'global',
        providers_list: state.providers,
        updated_at: new Date().toISOString(),
        updated_by: "dashboard",
      };

      try {
        await sbUpsert("system_settings", payload);
        showStatus(`✅ Configurations saved successfully at ${new Date().toLocaleTimeString()}`, "success");
        await loadSystemSettings();
      } catch (err) {
        showStatus(`❌ Save failed: ${err.message}`, "error");
      }
    }

    // ── TEST API ──────────────────────────────────────────────────────────
    async function testApi(index) {
      const p = state.providers[index];
      const resDiv = $(`testRes_${index}`);
      resDiv.innerHTML = `<span style="color:var(--blue)">⏳ Testing connection...</span>`;

      if (!p.api_key) {
        resDiv.innerHTML = `<span style="color:var(--red)">❌ Missing API Key</span>`;
        return;
      }
      if (!p.main_model) {
        resDiv.innerHTML = `<span style="color:var(--red)">❌ Missing Main Model</span>`;
        return;
      }

      const payload = {
        model: p.main_model,
        messages: [{ role: "user", content: "Reply with the word OK." }],
        max_tokens: 5,
        temperature: 0.1
      };

      let url = "";
      let headers = {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${p.api_key}`
      };

      if (p.provider === 'openrouter') {
        url = "https://openrouter.ai/api/v1/chat/completions";
        headers["HTTP-Referer"] = "https://github.com/hdanial211/Investment-AI_T";
        headers["X-Title"] = "Investment-AI_T";
      } else if (p.provider === 'openai') {
        url = "https://api.openai.com/v1/chat/completions";
      } else if (p.provider === 'deepseek') {
        url = "https://api.deepseek.com/v1/chat/completions";
      } else if (p.provider === 'anthropic') {
        url = "https://api.anthropic.com/v1/messages";
        headers = {
          "Content-Type": "application/json",
          "x-api-key": p.api_key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerously-allow-browser": "true" // Needed to test from frontend
        };
        payload.max_tokens = 5;
        delete payload.messages;
        payload.messages = [{ role: "user", content: "Reply with the word OK." }];
      } else if (p.provider === 'huggingface') {
        url = "https://router.huggingface.co/v1/chat/completions";
      } else {
        resDiv.innerHTML = `<span style="color:var(--red)">❌ Unsupported provider for test</span>`;
        return;
      }

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: headers,
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error?.message || JSON.stringify(data));
        }

        let replyText = "";
        if (p.provider === 'anthropic') {
          replyText = data.content?.[0]?.text;
        } else {
          replyText = data.choices?.[0]?.message?.content;
        }

        resDiv.innerHTML = `<span style="color:var(--green)">✅ Success! Model replied: "${safe(replyText)}"</span>`;
      } catch (err) {
        resDiv.innerHTML = `<span style="color:var(--red)">❌ Error: ${safe(err.message)}</span>`;
      }
    }

    // ── HELPERS ───────────────────────────────────────────────────────────
    function safe(v) { return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

    function showStatus(msg, type) {
      const bar = $("statusBar");
      bar.textContent = msg;
      bar.className = `status-bar ${type}`;
    }

    // ── INIT ─────────────────────────────────────────────────────────────
    if (state.anon) loadSystemSettings();
  </script>
</body>
</html>
