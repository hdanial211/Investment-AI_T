<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Keys — Investment-AI_T</title>
  <style>
    :root {
      --bg: #111814;
      --panel: rgba(245, 236, 216, 0.92);
      --paper: #fff7e8;
      --ink: #1a221e;
      --muted: #67716a;
      --line: rgba(65, 79, 69, 0.18);
      --gold: #c4913d;
      --green: #2c8b67;
      --red: #ad4f43;
      --blue: #2f668f;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(196, 145, 61, 0.34), transparent 32rem),
        radial-gradient(circle at 88% 16%, rgba(44, 139, 103, 0.26), transparent 30rem),
        linear-gradient(140deg, #101713, #253229 48%, #5a442a);
      font-family: "Trebuchet MS", "Gill Sans", Verdana, sans-serif;
    }

    .wrap {
      width: min(1100px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    /* ── NAV ───────────────────────────────────────────────────────────── */
    .nav {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }
    .nav a {
      color: rgba(255, 247, 232, 0.7);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 12px;
      transition: all 0.2s;
    }
    .nav a:hover { background: rgba(255, 255, 255, 0.08); color: #fff7e8; }
    .nav a.active { background: rgba(196, 145, 61, 0.22); color: var(--gold); }

    /* ── HERO ──────────────────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, rgba(255, 247, 232, 0.96), rgba(239, 222, 191, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: clamp(22px, 4vw, 36px);
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: "";
      position: absolute;
      right: -90px; bottom: -120px;
      width: 280px; height: 280px;
      border-radius: 50%;
      background: rgba(196, 145, 61, 0.18);
    }
    .eyebrow { color: var(--gold); font-size: 0.78rem; font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin: 10px 0 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.8rem, 5vw, 3.4rem); line-height: 0.95; letter-spacing: -0.04em; }
    .hero p { max-width: 700px; margin: 12px 0 0; color: var(--muted); font-size: 0.95rem; }

    /* ── SUPABASE INPUTS ───────────────────────────────────────────────── */
    .config-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      margin-top: 18px;
      position: relative;
      z-index: 1;
    }
    input, select, button { border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; font: inherit; font-size: 0.92rem; }
    input, select { background: rgba(255, 255, 255, 0.78); min-width: 0; }
    button { background: var(--ink); color: #fff7e8; cursor: pointer; font-weight: 800; transition: opacity 0.15s; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: default; }

    /* ── SECTION ──────────────────────────────────────────────────────────── */
    section {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 24px;
      box-shadow: var(--shadow);
      margin-top: 18px;
      padding: 22px;
    }

    /* ── DYNAMIC PROVIDERS ─────────────────────────────────────────────── */
    .provider-card {
      background: rgba(255, 247, 232, 0.6);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      position: relative;
    }
    .provider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--line);
    }
    .provider-title {
      font-family: Georgia, serif;
      font-size: 1.15rem;
      font-weight: bold;
    }
    .provider-title span.badge {
      font-family: sans-serif;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      margin-left: 10px;
      background: rgba(44, 139, 103, 0.15);
      color: var(--green);
    }
    .provider-title span.badge.fallback {
      background: rgba(196, 145, 61, 0.15);
      color: var(--gold);
    }
    .provider-controls button {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.6);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .provider-controls button:hover {
      background: var(--ink);
      color: #fff;
    }
    .provider-controls button.btn-danger {
      color: var(--red);
      border-color: rgba(173, 79, 67, 0.3);
    }
    .provider-controls button.btn-danger:hover {
      background: var(--red);
      color: #fff;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .form-row.full { grid-template-columns: 1fr; }
    label { display: block; color: var(--muted); font-size: 0.76rem; font-weight: 900; letter-spacing: 0.09em; text-transform: uppercase; margin-bottom: 5px; }

    .field-group input, .field-group select { width: 100%; }

    .add-provider-btn {
      width: 100%;
      background: rgba(44, 139, 103, 0.12);
      color: var(--green);
      border: 1px dashed rgba(44, 139, 103, 0.4);
      padding: 16px;
      font-size: 1rem;
    }
    .add-provider-btn:hover {
      background: rgba(44, 139, 103, 0.22);
    }

    .save-row { display: flex; gap: 10px; align-items: center; margin-top: 24px; }
    .save-row button { padding: 13px 28px; font-size: 1rem; }

    .test-api-btn {
      background: rgba(47, 102, 143, 0.12);
      color: var(--blue);
      border: 1px solid rgba(47, 102, 143, 0.3);
      width: 100%;
    }
    .test-api-btn:hover {
      background: rgba(47, 102, 143, 0.22);
      color: var(--blue);
    }

    /* ── STATUS BAR ────────────────────────────────────────────────────── */
    .status-bar {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 700;
      display: none;
    }
    .status-bar.success { display: block; background: rgba(44, 139, 103, 0.12); color: var(--green); border: 1px solid rgba(44, 139, 103, 0.25); }
    .status-bar.error { display: block; background: rgba(173, 79, 67, 0.12); color: var(--red); border: 1px solid rgba(173, 79, 67, 0.25); }
    .status-bar.info { display: block; background: rgba(47, 102, 143, 0.12); color: var(--blue); border: 1px solid rgba(47, 102, 143, 0.25); }

    @media (max-width: 800px) {
      .form-row, .config-row { grid-template-columns: 1fr; }
    }

    /* ── MODEL PICKER BTN ──────────────────────────────────────────────── */
    .model-picker-btn {
      width: 100%; text-align: left; background: rgba(255,255,255,0.78);
      color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
      padding: 11px 14px; font: inherit; font-size: 0.88rem; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      transition: all 0.2s;
    }
    .model-picker-btn:hover { background: rgba(255,255,255,0.95); border-color: var(--gold); }
    .model-picker-btn.locked { opacity: 0.45; cursor: not-allowed; }
    .model-picker-btn.locked:hover { background: rgba(255,255,255,0.78); border-color: var(--line); }
    .model-picker-btn .mn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .model-picker-btn .mn.empty { color: var(--muted); }
    .model-picker-btn .pi { font-size: 0.75rem; color: var(--gold); flex-shrink: 0; margin-left: 8px; }

    /* ── MODAL ─────────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      z-index: 1000; display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; animation: mFadeIn 0.2s ease; }
    @keyframes mFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes mSlideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal {
      background: var(--paper); border-radius: 24px;
      box-shadow: 0 32px 100px rgba(0,0,0,0.45);
      width: min(660px, calc(100% - 32px)); max-height: 82vh;
      overflow: hidden; display: flex; flex-direction: column;
      animation: mSlideUp 0.25s ease;
    }
    .modal-head {
      padding: 20px 24px 14px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-head h2 { font-family: Georgia, serif; font-size: 1.3rem; margin: 0; }
    .modal-head .mc { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted); padding: 4px 8px; border-radius: 8px; }
    .modal-head .mc:hover { background: rgba(0,0,0,0.06); color: var(--ink); }
    .modal-tabs { display: flex; gap: 0; padding: 0 24px; border-bottom: 1px solid var(--line); }
    .modal-tab {
      padding: 11px 20px; font-size: 0.84rem; font-weight: 700; cursor: pointer;
      border: none; background: none; color: var(--muted);
      border-bottom: 3px solid transparent; transition: all 0.15s;
    }
    .modal-tab:hover { color: var(--ink); }
    .modal-tab.act { color: var(--green); border-bottom-color: var(--green); }
    .modal-tab.act.tp { color: var(--gold); border-bottom-color: var(--gold); }
    .modal-body { padding: 16px 24px 24px; overflow-y: auto; flex: 1; }
    .m-card {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 16px; border: 1px solid var(--line); border-radius: 14px;
      margin-bottom: 9px; cursor: pointer; transition: all 0.15s;
      background: rgba(255,255,255,0.5);
    }
    .m-card:hover { background: rgba(196,145,61,0.08); border-color: var(--gold); transform: translateX(4px); }
    .m-card .mi { flex: 1; min-width: 0; }
    .m-card .mi-n { font-weight: 800; font-size: 0.92rem; margin-bottom: 1px; }
    .m-card .mi-id { font-family: monospace; font-size: 0.76rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .m-card .mi-d { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .m-card .mb { font-size: 0.68rem; font-weight: 900; padding: 4px 10px; border-radius: 999px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.05em; }
    .mb.free { background: rgba(44,139,103,0.15); color: var(--green); }
    .mb.paid { background: rgba(196,145,61,0.15); color: var(--gold); }
    .m-empty { text-align: center; padding: 36px 20px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- NAV -->
    <nav class="nav">
      <a href="index.html">📊 Dashboard</a>
      <a href="settings.html">⚙ Account Settings</a>
      <a href="api_keys.html" class="active">🔑 API Keys</a>
    </nav>

    <!-- HERO -->
    <header class="hero">
      <div class="eyebrow">Investment-AI_T system config</div>
      <h1>System & API Keys</h1>
      <p>Configure global AI providers and API keys. The bot dynamically fails over from top to bottom.</p>
      
      <div class="config-row">
        <input id="supabaseUrl" placeholder="Supabase URL, e.g. https://xxxx.supabase.co">
        <input id="supabaseAnon" placeholder="Supabase anon key">
        <button id="loadBtn">Load Config</button>
      </div>
    </header>

    <!-- FORM -->
    <section id="settingsPanel">
      <div id="providersContainer"></div>
      <button class="add-provider-btn" onclick="addProvider()">+ Add AI Provider</button>

      <div class="save-row">
        <button onclick="saveSettings()">💾 Save Config</button>
        <span id="lastSavedTxt" style="color:var(--muted);font-size:0.8rem;margin-left:auto"></span>
      </div>
      <div class="status-bar" id="statusBar"></div>
    </section>
  </main>

  <!-- MODEL PICKER MODAL -->
  <div class="modal-overlay" id="modelModal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">Pilih Model</h2>
        <button class="mc" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-tabs" id="modalTabs"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const DEFAULT_SUPABASE_URL = "https://kusyjtpcjyflxgfcqenb.supabase.co";
    const DEFAULT_SUPABASE_ANON = "sb_publishable_Pdf-F-j3PH3keLsZ8ZoEZA_tbotGoxM";
    const $ = (id) => document.getElementById(id);

    const state = {
      url: localStorage.getItem("supabaseUrl") || DEFAULT_SUPABASE_URL,
      anon: localStorage.getItem("supabaseAnon") || DEFAULT_SUPABASE_ANON,
      sys: null,
      providers: []
    };

    // ── MODEL CATALOG ────────────────────────────────────────────────────
    const MODEL_CATALOG = {
      openrouter: {
        free: [
          { id: "openai/gpt-oss-20b:free", name: "GPT-OSS 20B", desc: "Pantas & versatil untuk analisis" },
          { id: "openai/gpt-oss-120b:free", name: "GPT-OSS 120B", desc: "Reasoning kuat, sesuai risk review" },
          { id: "qwen/qwen3-next-80b-a3b-instruct:free", name: "Qwen3 Next 80B", desc: "Analisis & coding cemerlang" },
          { id: "google/gemini-2.0-flash-exp:free", name: "Gemini 2.0 Flash", desc: "Model pantas dari Google" },
          { id: "meta-llama/llama-4-maverick:free", name: "Llama 4 Maverick", desc: "Model terbaru dari Meta" },
          { id: "deepseek/deepseek-r1:free", name: "DeepSeek R1", desc: "Deep reasoning, ada rate limit" },
          { id: "mistralai/mistral-small-3.1-24b-instruct:free", name: "Mistral Small 3.1", desc: "Model Eropah, cepat & efisien" },
        ],
        paid: [
          { id: "openai/gpt-4.1", name: "GPT-4.1", desc: "Flagship OpenAI via OpenRouter" },
          { id: "anthropic/claude-sonnet-4", name: "Claude Sonnet 4", desc: "Anthropic terbaik via OpenRouter" },
          { id: "google/gemini-2.5-pro", name: "Gemini 2.5 Pro", desc: "Model pro Google" },
          { id: "deepseek/deepseek-r1", name: "DeepSeek R1 (Paid)", desc: "Tiada rate limit, laju penuh" },
          { id: "meta-llama/llama-4-behemoth", name: "Llama 4 Behemoth", desc: "Model terbesar Meta" },
        ]
      },
      openai: {
        free: [],
        paid: [
          { id: "gpt-4.1", name: "GPT-4.1", desc: "Model flagship OpenAI" },
          { id: "gpt-4.1-mini", name: "GPT-4.1 Mini", desc: "Pantas & murah" },
          { id: "gpt-4.1-nano", name: "GPT-4.1 Nano", desc: "Ultra pantas, paling murah" },
          { id: "o3", name: "O3", desc: "Reasoning lanjutan" },
          { id: "o4-mini", name: "O4 Mini", desc: "Reasoning pantas" },
        ]
      },
      anthropic: {
        free: [],
        paid: [
          { id: "claude-sonnet-4-20250514", name: "Claude Sonnet 4", desc: "Imbangan terbaik kelajuan/kualiti" },
          { id: "claude-opus-4-20250514", name: "Claude Opus 4", desc: "Paling berkuasa" },
          { id: "claude-3.5-haiku-20241022", name: "Claude 3.5 Haiku", desc: "Terpantas, termurah" },
        ]
      },
      deepseek: {
        free: [],
        paid: [
          { id: "deepseek-chat", name: "DeepSeek V3", desc: "Model umum serba boleh" },
          { id: "deepseek-reasoner", name: "DeepSeek R1", desc: "Reasoning lanjutan" },
        ]
      },
      huggingface: {
        free: [
          { id: "Qwen/Qwen3-4B-Instruct-2507", name: "Qwen3 4B", desc: "Ringan & pantas" },
          { id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B", name: "DeepSeek R1 Distill 7B", desc: "Reasoning model" },
          { id: "meta-llama/Llama-3.2-3B-Instruct", name: "Llama 3.2 3B", desc: "Model kompak Meta" },
          { id: "mistralai/Mistral-7B-Instruct-v0.3", name: "Mistral 7B", desc: "Model Eropah" },
        ],
        paid: []
      }
    };

    let pickerState = { index: -1, field: "" };
    const testedProviders = new Set();

    $("supabaseUrl").value = state.url;
    $("supabaseAnon").value = state.anon;

    $("loadBtn").addEventListener("click", () => {
      state.url = $("supabaseUrl").value.trim().replace(/\/$/, "");
      state.anon = $("supabaseAnon").value.trim();
      localStorage.setItem("supabaseUrl", state.url);
      localStorage.setItem("supabaseAnon", state.anon);
      loadSystemSettings();
    });

    // ── SUPABASE HELPERS ─────────────────────────────────────────────────
    async function sbGet(path) {
      if (!state.url || !state.anon) return [];
      const res = await fetch(`${state.url}/rest/v1/${path}`, {
        headers: { apikey: state.anon, Authorization: `Bearer ${state.anon}` },
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function sbUpsert(table, data) {
      if (!state.url || !state.anon) throw new Error("No Supabase config");
      const res = await fetch(`${state.url}/rest/v1/${table}`, {
        method: "POST",
        headers: {
          apikey: state.anon,
          Authorization: `Bearer ${state.anon}`,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates",
        },
        body: JSON.stringify(data),
      });
      if (!res.ok) throw new Error(await res.text());
      return true;
    }

    // ── LOAD ─────────────────────────────────────────────────────────────
    async function loadSystemSettings() {
      try {
        const rows = await sbGet("system_settings?id=eq.global");
        if (rows.length > 0) {
          state.sys = rows[0];
          state.providers = state.sys.providers_list || [];
          $("lastSavedTxt").innerText = `Last saved: ${state.sys.updated_at ? new Date(state.sys.updated_at).toLocaleString() : "never"}`;
          
          // Migrate old single provider layout to list if empty
          if (state.providers.length === 0 && state.sys.ai_provider) {
            state.providers.push({
              provider: state.sys.ai_provider,
              api_key: state.sys.ai_provider === 'openrouter' ? state.sys.openrouter_api_key : state.sys.hf_token,
              main_model: state.sys.ai_main_model,
              risk_model: state.sys.ai_risk_model
            });
          }
        } else {
          state.sys = { id: 'global' };
          state.providers = [{
            provider: 'openrouter',
            api_key: '',
            main_model: 'openai/gpt-oss-20b:free',
            risk_model: 'openai/gpt-oss-120b:free'
          }];
        }
        renderProviders();
        showStatus(`Loaded configurations successfully.`, "success");
      } catch (err) {
        showStatus(`Load failed: ${err.message}`, "error");
      }
    }

    // ── RENDER ───────────────────────────────────────────────────────────
    function renderProviders() {
      const container = $("providersContainer");
      container.innerHTML = "";
      
      state.providers.forEach((p, index) => {
        const isPrimary = index === 0;
        const badgeClass = isPrimary ? "badge" : "badge fallback";
        const badgeText = isPrimary ? "Primary" : `Fallback #${index}`;

        const html = `
          <div class="provider-card">
            <div class="provider-header">
              <div class="provider-title">
                Provider #${index + 1} <span class="${badgeClass}">${badgeText}</span>
              </div>
              <div class="provider-controls">
                <button onclick="moveUp(${index})" ${index === 0 ? 'disabled' : ''}>▲ Up</button>
                <button onclick="moveDown(${index})" ${index === state.providers.length - 1 ? 'disabled' : ''}>▼ Down</button>
                <button class="btn-danger" onclick="removeProvider(${index})">✖ Remove</button>
              </div>
            </div>

            <div class="form-row">
              <div class="field-group">
                <label>Provider Platform</label>
                <select onchange="updateProvider(${index}, 'provider', this.value)">
                  <option value="openrouter" ${p.provider === 'openrouter' ? 'selected' : ''}>OpenRouter</option>
                  <option value="openai" ${p.provider === 'openai' ? 'selected' : ''}>OpenAI (ChatGPT)</option>
                  <option value="anthropic" ${p.provider === 'anthropic' ? 'selected' : ''}>Anthropic (Claude)</option>
                  <option value="deepseek" ${p.provider === 'deepseek' ? 'selected' : ''}>DeepSeek</option>
                  <option value="huggingface" ${p.provider === 'huggingface' ? 'selected' : ''}>HuggingFace</option>
                </select>
              </div>
              <div class="field-group">
                <label>API Key</label>
                <input type="password" value="${safe(p.api_key)}" placeholder="sk-..." onchange="updateProvider(${index}, 'api_key', this.value)">
              </div>
            </div>

            <div class="form-row full" style="margin-top:10px;">
              <button class="test-api-btn" onclick="testApi(${index})">⚡ Test Connection & API Key</button>
            </div>
            
            <div id="testRes_${index}" style="font-size:0.8rem; margin-top:10px; font-family:monospace;"></div>

            <div class="form-row" style="margin-top:14px;">
              <div class="field-group">
                <label>Main Model</label>
                <button type="button" class="model-picker-btn ${testedProviders.has(index) ? '' : 'locked'}" onclick="openModelPicker(${index}, 'main_model')">
                  <span class="mn ${p.main_model ? '' : 'empty'}">${p.main_model ? safe(p.main_model) : '⊕ Pilih Model...'}</span>
                  <span class="pi">▾</span>
                </button>
              </div>
              <div class="field-group">
                <label>Risk Review Model</label>
                <button type="button" class="model-picker-btn ${testedProviders.has(index) ? '' : 'locked'}" onclick="openModelPicker(${index}, 'risk_model')">
                  <span class="mn ${p.risk_model ? '' : 'empty'}">${p.risk_model ? safe(p.risk_model) : '⊕ Pilih Model...'}</span>
                  <span class="pi">▾</span>
                </button>
              </div>
            </div>
            ${!testedProviders.has(index) ? '<div style="font-size:0.75rem;color:var(--muted);margin-top:6px;">🔒 Sila test API key dulu sebelum pilih model.</div>' : ''}
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });
    }

    // ── MUTATIONS ────────────────────────────────────────────────────────
    function updateProvider(index, field, value) {
      state.providers[index][field] = value.trim();
    }

    function addProvider() {
      state.providers.push({
        provider: 'openrouter',
        api_key: '',
        main_model: '',
        risk_model: ''
      });
      renderProviders();
    }

    function removeProvider(index) {
      state.providers.splice(index, 1);
      renderProviders();
    }

    function moveUp(index) {
      if (index === 0) return;
      const temp = state.providers[index - 1];
      state.providers[index - 1] = state.providers[index];
      state.providers[index] = temp;
      renderProviders();
    }

    function moveDown(index) {
      if (index === state.providers.length - 1) return;
      const temp = state.providers[index + 1];
      state.providers[index + 1] = state.providers[index];
      state.providers[index] = temp;
      renderProviders();
    }

    // ── MODEL PICKER ─────────────────────────────────────────────────────
    function openModelPicker(index, field) {
      if (!testedProviders.has(index)) {
        const resDiv = $(`testRes_${index}`);
        resDiv.innerHTML = `<span style="color:var(--red)">⚠️ Sila klik "Test Connection & API Key" dulu sebelum pilih model!</span>`;
        return;
      }
      pickerState = { index, field };
      const provider = state.providers[index].provider;
      const catalog = MODEL_CATALOG[provider] || { free: [], paid: [] };
      const label = field === 'main_model' ? 'Main Model' : 'Risk Review Model';
      $("modalTitle").textContent = `Pilih ${label}`;

      // Build tabs
      const hasFree = catalog.free.length > 0;
      const hasPaid = catalog.paid.length > 0;
      let tabsHtml = '';
      if (hasFree) tabsHtml += `<button class="modal-tab act" onclick="switchTab(this,'free')">🆓 Percuma (${catalog.free.length})</button>`;
      if (hasPaid) tabsHtml += `<button class="modal-tab ${!hasFree ? 'act tp' : 'tp'}" onclick="switchTab(this,'paid')">💎 Berbayar (${catalog.paid.length})</button>`;
      $("modalTabs").innerHTML = tabsHtml;

      // Show first available tab
      const defaultTab = hasFree ? 'free' : 'paid';
      renderModelList(catalog, defaultTab);
      $("modelModal").classList.add('open');
    }

    function switchTab(btn, type) {
      document.querySelectorAll('.modal-tab').forEach(t => { t.classList.remove('act'); });
      btn.classList.add('act');
      const provider = state.providers[pickerState.index].provider;
      const catalog = MODEL_CATALOG[provider] || { free: [], paid: [] };
      renderModelList(catalog, type);
    }

    function renderModelList(catalog, type) {
      const models = catalog[type] || [];
      if (models.length === 0) {
        $("modalBody").innerHTML = `<div class="m-empty">Tiada model ${type === 'free' ? 'percuma' : 'berbayar'} untuk provider ini.</div>`;
        return;
      }
      let html = '';
      for (const m of models) {
        html += `<div class="m-card" onclick="selectModel('${m.id.replace(/'/g, "\\'")}')">` +
          `<div class="mi"><div class="mi-n">${safe(m.name)}</div>` +
          `<div class="mi-id">${safe(m.id)}</div>` +
          `<div class="mi-d">${safe(m.desc)}</div></div>` +
          `<span class="mb ${type}">${type === 'free' ? 'FREE' : 'PAID'}</span></div>`;
      }
      $("modalBody").innerHTML = html;
    }

    function selectModel(modelId) {
      state.providers[pickerState.index][pickerState.field] = modelId;
      closeModal();
      renderProviders();
    }

    function closeModal() {
      $("modelModal").classList.remove('open');
    }

    // Close modal on overlay click
    $("modelModal").addEventListener('click', (e) => {
      if (e.target === $("modelModal")) closeModal();
    });

    // ── SAVE ─────────────────────────────────────────────────────────────
    async function saveSettings() {
      const payload = {
        id: 'global',
        providers_list: state.providers,
        updated_at: new Date().toISOString(),
        updated_by: "dashboard",
      };

      try {
        await sbUpsert("system_settings", payload);
        showStatus(`✅ Configurations saved successfully at ${new Date().toLocaleTimeString()}`, "success");
        await loadSystemSettings();
      } catch (err) {
        showStatus(`❌ Save failed: ${err.message}`, "error");
      }
    }

    // ── TEST API ──────────────────────────────────────────────────────────
    async function testApi(index) {
      const p = state.providers[index];
      const resDiv = $(`testRes_${index}`);
      resDiv.innerHTML = `<span style="color:var(--blue)">⏳ Testing connection...</span>`;

      if (!p.api_key) {
        resDiv.innerHTML = `<span style="color:var(--red)">❌ Sila masukkan API Key dahulu</span>`;
        return;
      }

      // Use a lightweight default model for testing if none selected yet
      const testModel = p.main_model || {
        openrouter: 'openai/gpt-oss-20b:free',
        openai: 'gpt-4.1-nano',
        anthropic: 'claude-3.5-haiku-20241022',
        deepseek: 'deepseek-chat',
        huggingface: 'Qwen/Qwen3-4B-Instruct-2507'
      }[p.provider] || 'openai/gpt-oss-20b:free';

      const payload = {
        model: testModel,
        messages: [{ role: "user", content: "Reply with the word OK." }],
        max_tokens: 5,
        temperature: 0.1
      };

      let url = "";
      let headers = {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${p.api_key}`
      };

      if (p.provider === 'openrouter') {
        url = "https://openrouter.ai/api/v1/chat/completions";
        headers["HTTP-Referer"] = "https://github.com/hdanial211/Investment-AI_T";
        headers["X-Title"] = "Investment-AI_T";
      } else if (p.provider === 'openai') {
        url = "https://api.openai.com/v1/chat/completions";
      } else if (p.provider === 'deepseek') {
        url = "https://api.deepseek.com/v1/chat/completions";
      } else if (p.provider === 'anthropic') {
        url = "https://api.anthropic.com/v1/messages";
        headers = {
          "Content-Type": "application/json",
          "x-api-key": p.api_key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerously-allow-browser": "true" // Needed to test from frontend
        };
        payload.max_tokens = 5;
        delete payload.messages;
        payload.messages = [{ role: "user", content: "Reply with the word OK." }];
      } else if (p.provider === 'huggingface') {
        url = "https://router.huggingface.co/v1/chat/completions";
      } else {
        resDiv.innerHTML = `<span style="color:var(--red)">❌ Unsupported provider for test</span>`;
        return;
      }

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: headers,
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error?.message || JSON.stringify(data));
        }

        let replyText = "";
        if (p.provider === 'anthropic') {
          replyText = data.content?.[0]?.text;
        } else {
          replyText = data.choices?.[0]?.message?.content;
        }

        resDiv.innerHTML = `<span style="color:var(--green)">✅ API Key sah! Model replied: "${safe(replyText)}"</span>`;
        testedProviders.add(index);
        renderProviders();
      } catch (err) {
        resDiv.innerHTML = `<span style="color:var(--red)">❌ Error: ${safe(err.message)}</span>`;
      }
    }

    // ── HELPERS ───────────────────────────────────────────────────────────
    function safe(v) { return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

    function showStatus(msg, type) {
      const bar = $("statusBar");
      bar.textContent = msg;
      bar.className = `status-bar ${type}`;
    }

    // ── INIT ─────────────────────────────────────────────────────────────
    if (state.anon) loadSystemSettings();
  </script>
</body>
</html>
